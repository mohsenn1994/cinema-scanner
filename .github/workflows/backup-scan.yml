# Manual check from GitHub — for when the Mac is off. Open the repo's Actions tab →
# "Check showtimes" → Run workflow. Nothing runs on a schedule.
name: Check showtimes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-showtimes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check showtimes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scan.js --quick --force
